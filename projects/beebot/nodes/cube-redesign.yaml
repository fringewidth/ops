notes: "Hinge cube (latched-edge servo pivot, 5 cm, 0.3 N m, as-built magnets): 10-cube walks over 3 seeds 0.850 reached / 0.024 harm (s0 0.822/0.021, s1000 0.866/0.031, s2000 0.863/0.021); harm is mostly knocks, ~0.014 an overhang the grid allows. Side-by-side video (tower script, seed 0): flywheel 5/20 then harmful, hinge 20/20: worktree runs/cube_redesign/video/side-by-side-s0.mp4. Idealisations: dropped edge/corner contacts (stands in for chamfers), perfect angle sensing, no mechanism mass/backlash/compliance, latch capture 3 mm (0.06 L), floor latch features. Stress sweep running (runs/cube_redesign/stress.sh): torque 0.15/0.1, no floor latch, catch 0.03, square edges. User 2026-11-12: 10 cm too big."
