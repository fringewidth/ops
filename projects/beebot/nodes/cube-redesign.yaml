notes: "2026-11-12 study done (branch cube-redesign 03b37ef, HARDWARE.md 'Redesign options'). Survey: no published lattice module meets the bar in 1 g; ballistic moves never do; reliable ones are quasi-static closed-loop. Pick: latched-edge servo pivot (hinge cube): latch the pivot edge, geared motor turns under position control, stalls driven back. MuJoCo (cube_hinge.py, magnets as built, 0.3 N m): 10-cube walks seed 0 0.82 reached / 0.021 harm (m14-sel 0.48/0.053), stores 0.93/0.010; assumes chamfered edges (with edge contacts 0.73/0.027). 0.014 of the harm is an overhang the grid allows (planner rule fixes it). Unknown: a latch+drive at any of 12 edges at 5 cm (8-10 cm realistic first). Running now: walks at seeds 1000 and 2000 (runs/cube_redesign/seeds.sh, 6 workers, ~CPU only)."
