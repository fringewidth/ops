notes: "Components (2026-11-13): shapes from public datasets (goal-datasets, goal-library-v2 bigger with the better voxeliser, goal-sources-more: voxel art packs, Objaverse+Cap3D, Text2Shape, Minecraft survey), shapes written by generator programs at three tiers (goal-library: Haiku simple, Sonnet everyday objects, Opus scenes/edits/A-to-B/tricks), grounding tasks (goal-grounding: complete the picture with 1-8 missing blocks, point at one cube, match/copy, questions about the picture; user 2026-11-13: 'remember to add this in the data mix'), Moondream filter with wrong-text controls (moondream-label), demonstrations by reversal (reverse-v2, reverse-v3 for 150-800 robots and edits; reverse-loader for generation at training time), forward store episodes for eating and objects (demos-v2, audited by data-audit), physics checks (joint-strength; physics-revision decision), engineering parts (machine-parts, cad-to-beebot). Mix proportions are not set yet: no hand quotas (no-data-skew-from-examples); decide by what passes the filters. Licences (user 2026-11-13): research-only sources (Text2Shape/ShapeNet, Fusion 360, StableText2Brick) are fine; the project is non-commercial and the trained model will be open-sourced; the data itself is not redistributed."
