notes: "fringewidth/beebot-think-tpu queued since 23:55 IST (clones tpu-port at start). Timing gate on fake data (1 then 8 chips), then the real 0.8B run if 8 chips reach 5 ex/s. Its schedule is sized for two sessions. The rvitm session continues it from the same resume.pt: after session 1 ends, the Mac downloads resume.pt (fringewidth token) and publishes it to rvitmpolicyboot/beebot-think-resume (rvitm token), then pushes the rvitm kernel (ROLE=second, which refuses to train from scratch). A CPU-kernel test settles whether attached datasets are pinned at push time; if not, the rvitm kernel can be queued before session 1 ends. The rvitm kernel queued at 07:42 is being deleted (it would have started mid-session-1 as a seed-1 run)."
