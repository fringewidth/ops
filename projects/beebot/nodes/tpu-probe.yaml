notes: "User 2026-11-10 ~23:40: use this week's TPU hours, 20 on fringewidth and 20 on rvitmpolicyboot; an agent does the port. TPU sessions can queue up to 24 h, so one kernel does both jobs: a short timing phase on fake data, then, at 5 or more examples/s on 8 chips, the real 0.8B run on the real data (private datasets) for the rest of the session, saving step-named checkpoints hourly; below 5 it exits. The same kernel is queued on both accounts and the slower one is cancelled while still queued. Failed or stuck attempts are capped at about 1.5 TPU hours."
