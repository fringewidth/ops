title: Which tasks the MuJoCo demo shows
summary: MuJoCo hosts only an empty flat floor, so pick the demo set (for example go to or move in the user's frame, flat letters, a low tower, small builds) and its swarm size (about 10).
why: Only 2.2% of the data (759 episodes) is an empty floor at 6-14 robots; a demo-focused store and fine-tune follow from this choice.
