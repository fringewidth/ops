result: "User 2026-11-11 ~15:55: the user always stands at the camera, and everything is in the camera's frame. Grid observation and action codes are turned into the camera's quarter turn (images identical under a joint turn, so absolute board sides are unobservable); thoughts and instructions use camera-frame words; execution turns actions back with the known camera pose. No user-position text."
