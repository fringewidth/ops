title: Fit 4B full weights on one 96 GB GPU
summary: 4B full-weights training needs about 117 GB without activation checkpointing and about 82 GB with it, so the GH200 run uses checkpointing.
why: It costs roughly 30% more compute per step but avoids a second GPU. Chosen by Claude, open to the user.
