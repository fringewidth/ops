result: "Commit c877a35 (control and follower tests pass, checked; trainer change reviewed: off unless --control_url or BEEBOT_CONTROL_URL). Live logs: scripts/kaggle_follow.py polls a running session's log into logs/<run>.out. Direct cancel: DeleteKernel stops a running session but deletes its output (last resort); CancelKernelSession is denied for our token. Kill switch: think_train polls a per-run random ntfy topic every 5 min (stop = final validation, checkpoint, exit; save = checkpoint), topic kept in ~/.config/beebot/runs (never in the repo), injected at push; verified end to end on a CPU Kaggle kernel, not yet on a GPU run (send 'save' once at the start of the next real run). Handoff runs/handoff/remote-control.md"
