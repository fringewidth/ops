title: Live logs and a stop switch for remote runs
summary: Kaggle and rented-GPU runs stream their metric lines to a local log the dashboard follows, and can be stopped cleanly (checkpoint, then exit) by the manager.
why: "User 2026-11-13: the Kaggle dry run should export logs so the manager can monitor it and cancel a run when something goes wrong (a network check if direct cancel is not possible)."
