notes: "2026-11-10 19:35: key works over IPv4 after the user allowlisted every IPv4 address (IPv6 still refused; the vultr collector now forces IPv4). With the key, every GPU plan still lists no locations. GPU stock is polled every 5 minutes from the public catalogue by ~/ops/collectors/vultr_gpu (series vultr_gpu_regions{plan}); it sends one ntfy notice to hrishik when a plan comes into stock and never orders. Launching still needs the user's explicit yes for that launch (CLAUDE.md)."
