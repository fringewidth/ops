title: Machine part datasets with functional labels
summary: Download machine/part datasets with human-friendly functional labels (Fusion 360 Gallery assemblies and joints, Mechanical Components Benchmark), break machines into labelled constituent parts, spec each part (function, loads, joints) and voxelise it to the beebot grid.
why: "User 2026-11-13: prefers downloads for diversity; 'get a machine, break it down into constituents, spec that and model it... we won't expect the full machine, just the constituents.'"
status: running
kind: task
parent: grant-push-3d
notes: "User 2026-11-13: 'i'd prefer downloads, gives us diversity. get a machine, break it down into constituents, spec that and model it. for this you'll need good enough datasets with human friendly functional labels. but we won't expect the full machine, just the constituents. this will likely need a physics revision. we'll have to brainstorm that as well upon inspecting the data.' Candidates (manager survey): Fusion 360 Gallery Assembly (8,251 assemblies, 154,468 parts; licence non-commercial research) and Assembly-Joint (32,148 joints with types rigid/revolute/slider/cylindrical/pin-slot/planar/ball, ~2.8 GB); MCB (58,696 parts, 68 expert-annotated classes on the ICS taxonomy; licence unstated, project page may be down); PartNet-Mobility (articulated objects, joints, part labels; needs a sign-up and terms, so the user does that); ABC (1M models, no labels, too big for the disk). Starts when an agent slot and disk free up (goal-library downloads first; 24 GB free)."
