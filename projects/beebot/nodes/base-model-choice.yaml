title: Qwen3-4B (text) or Qwen3.5-4B (vision-language) as the base
summary: "Choose the base for the 3D runs: rendered views plus voxel action slots with Qwen3.5, or voxel tokens only with Qwen3."
why: Switching costs one to two days of engineering and about 2-4x longer sequences; it is worth it only if the probe shows the visual prior transfers.
status: todo
kind: decision
parent: trk-trainer
notes: "Probe passed (vlm-probe). Caveat: the comparison is zero-shot; the text arms got ASCII, while our trained Qwen3 policy gets learned voxel-patch tokens, so the probe shows the visual prior transfers, not that a trained voxel-token model cannot catch up. Cost of switching: about 300 image tokens per step against 64 scene tokens, linear-attention kernels (flash-linear-attention) to install on the training GPU, torchvision for the processor, 1-2 days of engineering in think-model; actions keep voxel slots. Owed by the user."
depends:
- vlm-probe
