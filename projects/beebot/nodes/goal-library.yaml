title: End states written by language-model agents
summary: Haiku/Sonnet/Opus agents (by difficulty) write many ordered end states (voxel structures, object placements) with stranger-worded instructions; each is accepted only if it is at rest and the reversal takes it to a random-looking start.
why: "User 2026-11-13: variety comes from agents writing end states ('it's not hard to do a statue of liberty with blocks'), and the reversal turns each into unlimited randomized demos, like diffusion."
status: todo
kind: task
parent: grant-push-3d
notes: "User 2026-11-13: 'we spawn haiku agents or opus agents or sonnet agents or whatever based on the complexity to generate a bunch of end states... we then run the reversal algorithm to attain a randomized configuration (akin to diffusion)'. Needs: the user's yes and a cost figure before any Haiku/API or agent spend; reversal made long (start as spread as a natural scene) and able to take apart overhangs (statue's raised arm) with lookahead. World is 16x16x16 with up to ~115 robots. Structure-to-structure (user 2026-11-13: 'what if i ask it to move from statue of liberty to a tower of 5? that would be underrepresented'): yes, reversal to noise only gives random starts. Plan: guided reversal from end state B with the potential 'become A' (another library end state, or part of one) instead of 'become random', so starts include built structures; the start only needs to be legal and at rest, the end is exactly B. Robots a goal does not use need a place in the end state (parked, or left free). Edits (user OK 2026-11-13): agents write variations of library end states; reversal toward the original touching as few robots as possible; multi-turn text. No statue of liberty (user: too much world knowledge for a 4B model). Sources (user 2026-11-13: 'we can pick apart various things from this. repolygonise too. there are infinite possibilities'): StableText2Brick (MIT, 47k ShapeNet objects, 20^3, captions), IGLU / Minecraft Dialogue Corpus (MIT, 9x11x11 targets, multi-turn build dialogue), CraftAssist houses + part labels + command dialogues (MIT), Hack337/Minecraft-Schematics (669 builds with text); crop parts and re-voxelise to 16^3 with <= ~115 cells, keep what is connected to the floor and survives the reversal. Downloads wait for the user's yes. User 2026-11-13 go: 'we'll take thousands, even more. take the ones above 1GB as well. revoxelise to our grid, then spin up a small vision model to label each one and ensure they still look how they need to (moondream works for this, cheap too).' Started 2026-11-13: Sonnet agent (download, cut parts, re-voxelise, filter, render sample; moondream labelling code, run only when the GPU slot or an API is agreed). Disk: 24 GB free of 460; raw downloads capped so >= 8 GB stays free, raw files removed after conversion. Handoff runs/handoff/goal-library.md. Update 2026-11-13 10:30: the dataset part is done as goal-datasets (287,398 goals). What is left here: end states written by Haiku/Sonnet/Opus agents, which waits for the user's yes on the spend and a cost figure."
