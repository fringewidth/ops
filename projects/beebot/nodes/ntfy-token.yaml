title: ntfy access token for ops alerts
summary: "The user creates a free ntfy.sh account and token and runs: cd ~/ops/worker && npx wrangler secret put NTFY_TOKEN."
why: ntfy rejects anonymous posts from Cloudflare's shared IPs (429), so worker alerts cannot reach the phone without a token.
