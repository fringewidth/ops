title: Where rvitmpolicyboot's Kaggle credentials are
summary: The TPU agent needs the folder holding rvitmpolicyboot's Kaggle access token (path only) to queue the same kernel on that account.
why: TPU sessions can queue for up to 24 hours, so queueing on both accounts halves the wait; searching the disk for credentials is not allowed, so only the user can say where they are.
