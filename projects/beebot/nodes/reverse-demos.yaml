result: "Prototype on main 8eff668 (src/beebot/vla/voxel/reverse.py, scripts/reverse_demos.py, 11 tests pass, rerun by manager): 200 episodes per family replay forward exactly (1.00 tower/bridge/letter/push); natural start 0.97/0.77/1.00/1.00; 28-146 steps/s per core (enough for online use). Limits: goals tiny (3-9 robots), take-apart short (mean 5-12 steps, starts near the goal), a span over open air cannot be finished under the pivot rule (bridge = trench filler), letters are blobs. Handoff runs/handoff/reverse-demos.md; numbers runs/reverse_demos/check.json."
