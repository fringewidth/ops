<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<link rel="manifest" href="manifest.webmanifest">

<meta name="theme-color" content="#0e0e0d" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.min.css">
<script src="https://cdn.jsdelivr.net/npm/uplot@1.6.30/dist/uPlot.iife.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --surface-2: #efede7; --surface-3: #e7e4dc;
  --line: #e4e1d9; --line-2: #d6d2c8;
  --text: #1c1b18; --text-2: #5c5a53; --text-3: #94918a;
  --accent: #d0532f; --link: #2f5fd8;
  --todo: #b3afa5; --queued: #c98a14; --running: #2f6bf0; --done: #2e9a5c; --failed: #d6453b; --dropped: #cfccc4;
  --ready: #2e9a5c;
  --edge: #c3bfb4; --shadow: 0 1px 2px rgba(28,27,24,.05), 0 2px 8px rgba(28,27,24,.04);
  --sheet-shadow: 0 -8px 40px rgba(28,27,24,.18);
  --g0: #ecebe5; --g1: #e3e1d9;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0e0e0d; --surface: #181816; --surface-2: #1f1f1c; --surface-3: #2a2925;
    --line: #2a2926; --line-2: #3a3934;
    --text: #edebe6; --text-2: #a9a69e; --text-3: #6f6c66;
    --accent: #f07a50; --link: #86a6ff;
    --todo: #6f6c66; --queued: #e2a53a; --running: #6d95ff; --done: #4cc07c; --failed: #f06a5f; --dropped: #3a3934;
    --ready: #4cc07c;
    --edge: #4a4842; --shadow: 0 1px 2px rgba(0,0,0,.3);
    --sheet-shadow: 0 -8px 40px rgba(0,0,0,.6);
    --g0: #161614; --g1: #1d1d1a;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; overflow-x: hidden; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-feature-settings: "cv11", "ss01"; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--link); text-decoration: none; }

/* ---------- chrome ---------- */
.top { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid var(--line); padding: calc(10px + env(safe-area-inset-top)) 20px 10px; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand select, .brand .name { appearance: none; -webkit-appearance: none; border: 0; background: none; padding: 0; font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.brand .sub { font-size: 12px; color: var(--text-3); white-space: nowrap; }
.tabs { display: flex; gap: 2px; background: var(--surface-2); border-radius: 10px; padding: 3px; margin-left: auto; }
.tabs button { display: flex; align-items: center; gap: 7px; border: 0; background: none; padding: 6px 13px; border-radius: 8px; color: var(--text-2); font-size: 13.5px; font-weight: 500; }
.tabs button svg { width: 16px; height: 16px; }
.tabs button.on { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }
.icon-btn { border: 0; background: none; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; color: var(--text-2); }
.icon-btn:hover { background: var(--surface-2); }
.icon-btn svg { width: 19px; height: 19px; }
main { max-width: 1080px; margin: 0 auto; padding: 8px 20px 60px; }

/* ---------- type and blocks ---------- */
.section { margin-top: 30px; }
.section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.section-head h2 { margin: 0; font-size: 13px; font-weight: 600; color: var(--text-2); letter-spacing: .01em; }
.section-head .count { font-size: 12px; color: var(--text-3); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.pad { padding: 16px 18px; }
.muted { color: var(--text-2); } .faint { color: var(--text-3); }
.small { font-size: 13px; } .tiny { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.empty { color: var(--text-3); font-size: 14px; padding: 6px 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: inline-block; background: var(--todo); }
.st-todo { --c: var(--todo); } .st-queued { --c: var(--queued); } .st-running { --c: var(--running); } .st-done { --c: var(--done); } .st-failed { --c: var(--failed); } .st-dropped { --c: var(--dropped); }
.dot[class*="st-"] { background: var(--c); }
.st-running.dot { box-shadow: 0 0 0 0 color-mix(in srgb, var(--running) 55%, transparent); animation: pulse 2s infinite; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--running) 50%, transparent); } 70% { box-shadow: 0 0 0 7px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 9px; border-radius: 99px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; }
.pill.status { background: color-mix(in srgb, var(--c) 14%, transparent); color: color-mix(in srgb, var(--c) 80%, var(--text)); }
.pill.link { cursor: pointer; }
.pill.link:hover { background: var(--surface-3); }
.bar { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--text); border-radius: 99px; }

/* ---------- now ---------- */
.attention { display: flex; flex-direction: column; gap: 8px; }
.alert { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-radius: 12px; background: color-mix(in srgb, var(--queued) 10%, var(--surface)); border: 1px solid color-mix(in srgb, var(--queued) 25%, var(--line)); font-size: 14px; cursor: default; }
.alert.bad { background: color-mix(in srgb, var(--failed) 9%, var(--surface)); border-color: color-mix(in srgb, var(--failed) 25%, var(--line)); }
.alert .dot { margin-top: 7px; background: var(--queued); } .alert.bad .dot { background: var(--failed); }
.alert[data-node] { cursor: pointer; }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
.stat { padding: 16px 18px 15px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.stat .label { font-size: 13px; color: var(--text-2); line-height: 1.35; }
.stat .label .faint { display: block; font-size: 12px; }
.checks { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
.checks span { display: flex; align-items: center; gap: 8px; }
.dot.ok { background: var(--done); } .dot.no { background: var(--failed); }
.stat .value { font-size: 28px; font-weight: 600; letter-spacing: -.02em; line-height: 1.1; }
.stat .value small { font-size: 15px; font-weight: 500; color: var(--text-3); margin-left: 3px; letter-spacing: 0; }
.stat .foot { font-size: 12px; color: var(--text-3); display: flex; justify-content: space-between; }
.stat svg.spark { height: 28px; }
.runs { display: flex; flex-direction: column; gap: 10px; }
.run { padding: 16px 18px; display: grid; grid-template-columns: 1fr auto; gap: 6px 18px; cursor: pointer; }
.run:hover { border-color: var(--line-2); }
.run .title { font-weight: 600; font-size: 15.5px; display: flex; gap: 10px; align-items: center; min-width: 0; }
.run .title span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.run .meta { grid-column: 1; font-size: 13px; color: var(--text-2); }
.run .metric { grid-row: 1 / span 2; grid-column: 2; text-align: right; min-width: 92px; }
.run .metric b { font-size: 20px; font-weight: 600; display: block; letter-spacing: -.01em; }
.run .progress { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-3); margin-top: 6px; }
.run .progress .bar { flex: 1; height: 4px; }
.run .progress .bar > i { background: var(--running); }
.lanes { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.lane { padding: 14px 16px 8px; }
.lane-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.lane-head b { font-size: 14px; font-weight: 600; }
.task-row { display: flex; gap: 10px; align-items: baseline; padding: 9px 0; border-top: 1px solid var(--line); cursor: pointer; font-size: 14px; }
.task-row:first-of-type { border-top: 0; }
.task-row .t { flex: 1; min-width: 0; }
.task-row .dot { transform: translateY(-1px); }
.msgs { display: flex; flex-direction: column; gap: 10px; }
.msg { padding: 12px 16px; font-size: 14px; }
.msg .who { font-size: 12px; color: var(--text-3); margin-bottom: 3px; }
.compose { display: flex; gap: 8px; margin-top: 10px; }
.compose input { flex: 1; min-width: 0; }
.field, .compose input { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; font-size: 15px; outline: none; }
.field:focus, .compose input:focus { border-color: var(--line-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--link) 15%, transparent); }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-size: 14px; font-weight: 500; }
.btn.primary { background: var(--text); color: var(--bg); border-color: var(--text); }
.btn:disabled { opacity: .5; }

/* ---------- plan ---------- */
body.plan main { max-width: none; padding: 0; }
.graph { position: fixed; left: 0; right: 0; top: var(--top-h, 60px); bottom: 0; overflow: hidden; touch-action: none; background:
  radial-gradient(circle at 1px 1px, color-mix(in srgb, var(--text-3) 30%, transparent) 1px, transparent 0) 0 0 / 22px 22px, var(--bg); cursor: grab; }
.graph.dragging { cursor: grabbing; }
.graph svg.canvas { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; }
.graph .loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--text-3); }
.toolbar { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; pointer-events: none; }
.toolbar > * { pointer-events: auto; }
.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; box-shadow: var(--shadow); }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 7px; font-size: 13px; color: var(--text-2); font-weight: 500; }
.seg button.on { background: var(--surface-2); color: var(--text); }
.toolbar .search { width: 190px; box-shadow: var(--shadow); padding: 7px 12px; font-size: 14px; }
.crit-note { font-size: 12.5px; color: var(--text-2); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 11px; box-shadow: var(--shadow); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crit-note b { color: var(--accent); font-weight: 600; }
.zoom { position: absolute; right: 14px; bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.zoom button { border: 0; background: none; width: 40px; height: 40px; display: grid; place-items: center; color: var(--text-2); }
.zoom button + button { border-top: 1px solid var(--line); }
.zoom svg { width: 18px; height: 18px; }
.legend { position: absolute; left: 14px; bottom: calc(16px + env(safe-area-inset-bottom)); display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 7px 12px; box-shadow: var(--shadow); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
svg .grp rect.box { fill: var(--g0); stroke: var(--line); }
svg .grp.d1 rect.box { fill: var(--g1); }
svg .grp text.gt { font: 600 13px Inter, sans-serif; fill: var(--text); letter-spacing: -.005em; }
svg .grp text.gs { font: 500 11.5px Inter, sans-serif; fill: var(--text-3); }
svg .grp rect.track { fill: var(--surface-3); }
svg .grp rect.fill { fill: var(--done); }
svg .nd rect.box { fill: var(--surface); stroke: var(--line-2); stroke-width: 1; }
svg .nd.ready rect.box { stroke: var(--ready); stroke-width: 1.5; }
svg .nd.st-running rect.box { stroke: var(--running); stroke-width: 1.75; }
svg .nd.st-failed rect.box { stroke: var(--failed); stroke-width: 1.5; }
svg .nd.st-done, svg .grp.st-done { opacity: .5; }
svg .nd text.t { font: 600 13px Inter, sans-serif; fill: var(--text); }
svg .nd text.m { font: 500 11.5px Inter, sans-serif; fill: var(--text-3); }
svg .nd text.v { font: 650 13px Inter, sans-serif; fill: var(--text); text-anchor: end; }
svg .nd text.tag { font: 600 10.5px Inter, sans-serif; letter-spacing: .02em; }
svg .nd circle.sd { fill: var(--c); }
svg .nd.st-running circle.halo { fill: var(--running); opacity: .25; animation: halo 2s infinite; transform-box: fill-box; transform-origin: center; }
@keyframes halo { 0% { transform: scale(1); opacity: .35; } 100% { transform: scale(2.6); opacity: 0; } }
svg .nd, svg .grp { cursor: pointer; }
svg .nd:hover rect.box { stroke: var(--text-3); }
svg path.edge { fill: none; stroke: var(--edge); stroke-width: 1.5; }
svg path.edge.crit { stroke: var(--accent); stroke-width: 2; }
svg .dim { opacity: .14 !important; }
svg .hl rect.box { stroke: var(--text) !important; stroke-width: 2 !important; }
svg path.edge.hl { stroke: var(--text); stroke-width: 2; }
svg .match rect.box { stroke: var(--link) !important; stroke-width: 2.5 !important; }
.list { padding: 76px 20px 40px; max-width: 900px; margin: 0 auto; }
.tree-row { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.tree-row .tw { width: 16px; color: var(--text-3); flex: none; text-align: center; }
.tree-row .body { flex: 1; min-width: 0; }
.tree-row .body b { font-weight: 600; }
.tree-row .body .s { font-size: 13px; color: var(--text-2); }
.tree-row .dot { margin-top: 8px; }

/* ---------- numbers ---------- */
.chart-card { padding: 14px 14px 8px; margin-top: 14px; }
.chart-head { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.chart-head .title { font-weight: 600; flex: 1; min-width: 140px; }
.chart-head select { background: var(--surface-2); border: 0; border-radius: 8px; padding: 5px 9px; font-size: 13px; }
.u-legend { font-size: 12px; color: var(--text-2); }
.series-group { margin-top: 22px; }
.series-row { display: grid; grid-template-columns: 1fr 120px auto; gap: 16px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--line); cursor: pointer; }
.series-row:first-child { border-top: 0; }
.series-row.on { background: color-mix(in srgb, var(--link) 7%, transparent); }
.series-row .lbl { min-width: 0; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; font-size: 14px; }
.series-row .val { text-align: right; font-weight: 600; font-size: 15px; }
.series-row .val small { display: block; font-weight: 400; font-size: 11.5px; color: var(--text-3); }
svg.spark { width: 100%; height: 26px; display: block; overflow: visible; }
svg.spark path.l { fill: none; stroke: var(--text-2); stroke-width: 1.5; vector-effect: non-scaling-stroke; }
svg.spark path.a { fill: color-mix(in srgb, var(--text-2) 10%, transparent); stroke: none; }

/* ---------- history ---------- */
.day { margin-top: 26px; }
.day h3 { font-size: 13px; color: var(--text-2); font-weight: 600; margin: 0 0 8px; }
.event { display: grid; grid-template-columns: 52px 1fr; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.event:first-of-type { border-top: 0; }
.event .when { color: var(--text-3); font-size: 13px; }
.event .who { color: var(--text-3); }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.28); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 40; }
.scrim.open { opacity: 1; pointer-events: auto; }
@media (min-width: 761px) { .scrim.open { opacity: 0; } body.plan .scrim.open { pointer-events: none; } }
.sheet { position: fixed; z-index: 41; background: var(--surface); overflow-y: auto; overscroll-behavior: contain; transition: transform .28s cubic-bezier(.2,.8,.2,1); }
@media (min-width: 761px) {
  .sheet { top: 0; right: 0; bottom: 0; width: 460px; border-left: 1px solid var(--line); transform: translateX(105%); box-shadow: -10px 0 40px rgba(0,0,0,.08); padding: calc(18px + env(safe-area-inset-top)) 26px 40px; }
  .sheet.open { transform: none; }
  .handle { display: none; }
}
.sheet .x { position: sticky; top: 0; float: right; margin: -6px -10px 0 0; background: var(--surface); }
.sheet h1 { font-size: 22px; line-height: 1.25; letter-spacing: -.015em; margin: 10px 0 8px; font-weight: 650; }
.sheet .summary { font-size: 16px; line-height: 1.5; margin: 0 0 18px; }
.kv { display: grid; grid-template-columns: 104px 1fr; gap: 10px 14px; font-size: 14px; margin: 18px 0; }
.kv > div:nth-child(odd) { color: var(--text-3); }
.kv .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.why { background: var(--surface-2); border-radius: 12px; padding: 13px 15px; font-size: 14.5px; color: var(--text); }
.why b { display: block; font-size: 12px; color: var(--text-3); font-weight: 600; margin-bottom: 3px; }
.metric-box { margin: 18px 0; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; }
.metric-box .big { font-size: 30px; font-weight: 650; letter-spacing: -.02em; }
.metric-box svg.spark { height: 54px; margin-top: 8px; }
.sheet details { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 14px; }
.sheet summary { cursor: pointer; font-weight: 600; font-size: 14px; color: var(--text-2); list-style: none; }
.sheet summary::-webkit-details-marker { display: none; }
.sheet textarea { width: 100%; min-height: 240px; font: 12.5px/1.5 ui-monospace, "SF Mono", Menlo, monospace; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-top: 10px; }
.status-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.status-pick button { border: 1px solid var(--line); background: none; border-radius: 99px; padding: 4px 11px; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.status-pick button.on { border-color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); }
.save-row { display: flex; gap: 10px; align-items: center; margin-top: 12px; }

/* ---------- phone ---------- */
@media (max-width: 760px) {
  .top { padding-left: 16px; padding-right: 10px; backdrop-filter: none; -webkit-backdrop-filter: none; background: var(--bg); }
  main { padding: 4px 16px calc(96px + env(safe-area-inset-bottom)); }
  .tabs { position: fixed; left: 0; right: 0; bottom: 0; margin: 0; border-radius: 0; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-top: 1px solid var(--line); justify-content: space-around; z-index: 30; }
  .tabs button { flex-direction: column; gap: 3px; font-size: 11px; padding: 6px 4px; flex: 1; }
  .tabs button svg { width: 22px; height: 22px; }
  .tabs button.on { background: none; box-shadow: none; color: var(--text); }
  .tabs button:not(.on) svg { opacity: .7; }
  .gear { margin-left: auto; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .stat { padding: 14px; }
  .stat .value { font-size: 24px; }
  .lanes { grid-template-columns: 1fr; }
  .graph { bottom: calc(62px + env(safe-area-inset-bottom)); }
  .toolbar .search { width: 140px; }
  .legend { display: none; }
  .zoom { bottom: 14px; }
  .list { padding: 70px 16px calc(96px + env(safe-area-inset-bottom)); }
  .series-row { grid-template-columns: 1fr 70px auto; gap: 10px; padding: 12px 14px; }
  .sheet { left: 0; right: 0; bottom: 0; max-height: 90dvh; border-radius: 20px 20px 0 0; transform: translateY(105%); box-shadow: var(--sheet-shadow); padding: 8px 20px calc(30px + env(safe-area-inset-bottom)); }
  .sheet.open { transform: none; }
  .handle { width: 38px; height: 5px; border-radius: 99px; background: var(--line-2); margin: 4px auto 6px; }
  .kv { grid-template-columns: 92px 1fr; }
}
@media (min-width: 761px) { .gear { margin-left: 4px; } }
</style>
</head>
<body>
<header class="top" id="top">
  <div class="brand"><span id="projectSlot"></span><span class="sub" id="sub"></span></div>
  <nav class="tabs" id="tabs"></nav>
  <button class="icon-btn gear" id="settingsBtn" aria-label="settings"></button>
</header>
<main id="main"></main>
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet"></aside>
<script>
"use strict";
// ======================================================================
// helpers
// ======================================================================
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch { return null; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
const ICON = {
  now: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',
  plan: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="7" height="5" rx="1.5"/><rect x="14" y="15" width="7" height="5" rx="1.5"/><rect x="14" y="4" width="7" height="5" rx="1.5"/><path d="M10 6.5h4M17.5 9v6"/></svg>',
  numbers: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5M4 19h16"/><path d="M7 15l4-5 3 3 5-7"/></svg>',
  history: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  fit: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>',
};
const TABS = [["now", "Now"], ["plan", "Plan"], ["numbers", "Numbers"], ["history", "History"]];
const STATUSES = ["todo", "queued", "running", "done", "failed", "dropped"];
const OPEN = new Set(["todo", "queued", "running"]);
const status = (n) => n.status || "todo";

function parseTime(s) {
  if (s == null) return NaN;
  if (typeof s === "number") return s < 1e12 ? s * 1000 : s;
  const m = String(s).match(/^(\d{4}-\d\d-\d\d)[ T](\d\d:\d\d(?::\d\d)?)(?:\s*([+-]\d\d):?(\d\d))?/);
  if (m) return Date.parse(`${m[1]}T${m[2]}${m[3] ? `${m[3]}:${m[4]}` : ""}`);
  return Date.parse(s);
}
function span(ms) {
  const m = Math.round(Math.abs(ms) / 60000);
  if (m < 1) return "under a minute";
  if (m < 60) return `${m} min`;
  const h = Math.floor(m / 60), r = m % 60;
  if (h < 24) return r && h < 10 ? `${h} h ${r} min` : `${h} h`;
  const d = Math.floor(h / 24), rh = h % 24;
  return rh && d < 4 ? `${d} d ${rh} h` : `${d} d`;
}
const ago = (t) => (Number.isFinite(t) ? (Date.now() - t < 60000 ? "just now" : `${span(Date.now() - t)} ago`) : "");
const until = (t) => (t > Date.now() ? `in ${span(t - Date.now())}` : `${span(Date.now() - t)} ago`);
function clock(t) {
  const d = new Date(t), now = new Date();
  const hm = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  if (d.toDateString() === now.toDateString()) return hm;
  return `${d.toLocaleDateString([], { month: "short", day: "numeric" })}, ${hm}`;
}
function fmtNum(v) {
  if (v == null || !Number.isFinite(v)) return "–";
  const a = Math.abs(v);
  if (a >= 1e6) return (v / 1e6).toFixed(1) + "M";
  if (a >= 1e4) return (v / 1e3).toFixed(1) + "k";
  if (a >= 100) return Math.round(v).toLocaleString();
  if (a >= 10) return v.toFixed(1);
  if (a === 0) return "0";
  return v.toPrecision(3);
}
// value formatting from the series name only: _percent, _bytes, _at (a unix time), _hours, _seconds
function unitOf(name) {
  if (/_percent$/.test(name)) return "%";
  if (/_bytes$/.test(name)) return "GB";
  if (/_at$/.test(name)) return "time";
  if (/_hours?(_|$)/.test(name)) return "h";
  if (/_seconds$/.test(name)) return "s";
  if (/_usd(_|$)/.test(name)) return "$";
  return "";
}
function fmtValue(name, v, withUnit = true) {
  const u = unitOf(name);
  if (v == null) return "–";
  if (u === "%") return `${Math.round(v)}${withUnit ? "%" : ""}`;
  if (u === "GB") return `${(v / 2 ** 30).toFixed(1)}${withUnit ? " GB" : ""}`;
  if (u === "time") return until(parseTime(v));
  if (u === "h") return `${fmtNum(v)}${withUnit ? " h" : ""}`;
  if (u === "s") return span(v * 1000);
  if (u === "$") return `${withUnit ? "$" : ""}${fmtNum(v)}`;
  return fmtNum(v);
}
const ACRONYMS = new Set(["gpu", "cpu", "mem", "kl", "lm", "sft", "id", "ram", "vram", "io", "usd", "http", "url"]);
function humanName(name) {
  const words = name.replace(/_(percent|bytes|at|hours?|seconds)$/, "").replace(/_usd(_|$)/, "$1").split("_").filter(Boolean);
  return words.map((w, i) => (ACRONYMS.has(w) ? w.toUpperCase() : i === 0 ? w[0].toUpperCase() + w.slice(1) : w)).join(" ");
}

// ======================================================================
// data
// ======================================================================
let state, project, series = [], seriesById = new Map();
const hashTab = location.hash.slice(1).split("/")[0], hashNode = location.hash.slice(1).split("/")[1];
const knownTab = (t) => TABS.some(([name]) => name === t);
let tab = [hashTab, store.get("tab")].find(knownTab) || "now";
const P = () => state.projects[project];
const nodes = () => P().nodes;
let _byId;
const byId = () => (_byId ||= Object.fromEntries(nodes().map((n) => [n.id, n])));
const worker = () => (state.config.worker || "").replace(/\/$/, "");

async function load() {
  state = await (await fetch("state.json?" + Date.now())).json();
  const names = Object.keys(state.projects);
  project = names.includes(store.get("project")) ? store.get("project") : names[0];
  _byId = null;
  await refreshSeries();
  render();
  if (hashNode && byId()[hashNode] && !load.opened) { load.opened = true; openNode(hashNode); }
}
async function refreshSeries() {
  if (!worker()) return;
  try {
    series = await (await fetch(worker() + "/series")).json();
    seriesById = new Map(series.map((s) => [s.id, s]));
  } catch { series = []; }
}
const pointCache = new Map();
async function points(ids, since = 0, max = 300) {
  ids = [...new Set(ids)].filter(Boolean);
  if (!ids.length || !worker()) return {};
  const out = {};
  for (let i = 0; i < ids.length; i += 40) {
    const chunk = ids.slice(i, i + 40);
    try { Object.assign(out, await (await fetch(`${worker()}/points?id=${chunk.join(",")}&since=${since}&max=${max}`)).json()); } catch {}
  }
  return out;
}
function parseSelector(text) {
  const m = String(text || "").match(/^\s*([^{\s]+)\s*(?:\{(.*)\})?\s*$/);
  if (!m) return null;
  const labels = {};
  for (const l of (m[2] || "").matchAll(/(\w+)\s*=\s*"([^"]*)"/g)) labels[l[1]] = l[2];
  return { name: m[1], labels };
}
function matching(selector) {
  const sel = parseSelector(selector);
  if (!sel) return [];
  const found = series.filter((s) => s.name === sel.name && Object.entries(sel.labels).every(([k, v]) => s.labels[k] === v));
  const fresh = found.filter((s) => !stale(s));
  return fresh.length ? fresh : found; // a source that stopped reporting gives way to the one that replaced it
}
// a series is stale when nothing has reported it for STALE_MS; the Numbers tab hides it unless asked
const STALE_MS = 2 * 3600000;
const stale = (s) => Date.now() - s.last_t > STALE_MS;
// labels worth showing: those that differ between series of the same name
function varyingLabels(s) {
  const same = series.filter((x) => x.name === s.name);
  return Object.entries(s.labels).filter(([k]) => new Set(same.map((x) => x.labels[k])).size > 1);
}
function seriesLabel(s) {
  const v = varyingLabels(s);
  return v.length ? v.map(([, val]) => val).join(" · ") : "";
}

// ======================================================================
// planning logic
// ======================================================================
function readyNodes() {
  const ids = byId();
  return nodes().filter((n) => ["todo", "queued"].includes(status(n))
    && (n.depends || []).every((d) => !ids[d] || status(ids[d]) === "done")
    && !nodes().some((c) => c.parent === n.id && OPEN.has(status(c))));
}
function criticalPath() {
  const ids = byId(), memo = {};
  const cost = (n) => (OPEN.has(status(n)) ? Number(n.est_h) || 0 : 0);
  function longest(id, seen) {
    if (memo[id]) return memo[id];
    if (seen.has(id)) return { h: 0, path: [] };
    seen.add(id);
    let best = { h: 0, path: [] };
    for (const d of ids[id].depends || []) if (ids[d] && OPEN.has(status(ids[d]))) { const r = longest(d, seen); if (r.h > best.h) best = r; }
    return (memo[id] = { h: best.h + cost(ids[id]), path: [...best.path, id] });
  }
  let best = { h: 0, path: [] };
  for (const n of nodes()) if (OPEN.has(status(n))) { const r = longest(n.id, new Set()); if (r.h > best.h) best = r; }
  return best;
}
function descendants(id) {
  const out = [];
  for (const n of nodes()) if (n.parent === id) out.push(n, ...descendants(n.id));
  return out;
}
function upstream(id, seen = new Set()) {
  for (const d of byId()[id]?.depends || []) if (!seen.has(d) && byId()[d]) { seen.add(d); upstream(d, seen); }
  return seen;
}
function downstream(id, seen = new Set()) {
  for (const n of nodes()) if ((n.depends || []).includes(id) && !seen.has(n.id)) { seen.add(n.id); downstream(n.id, seen); }
  return seen;
}
const metricSeries = (n) => (n.metric?.series ? matching(n.metric.series)[0] : null);

async function insights() {
  const out = [], ids = byId(), ready = readyNodes();
  for (const n of nodes().filter((n) => status(n) === "running")) {
    const alive = matching(`ops_claim_alive{node="${n.id}",project="${project}"}`)[0];
    if (alive && alive.last_v === 0) out.push({ bad: true, node: n.id, text: `<b>${esc(n.title)}</b> is marked running, but its process is gone.` });
    else if (alive && Date.now() - alive.last_t > 10 * 60000) out.push({ node: n.id, text: `No liveness report for <b>${esc(n.title)}</b> in ${span(Date.now() - alive.last_t)}.` });
    const ends = parseTime(n.claim?.ends);
    if (ends && ends < Date.now() - 15 * 60000) out.push({ node: n.id, text: `<b>${esc(n.title)}</b> was expected to finish ${span(Date.now() - ends)} ago.` });
  }
  for (const [name, r] of Object.entries(P().meta.resources || {})) {
    const busy = nodes().filter((n) => status(n) === "running" && n.needs === name).length;
    const waiting = ready.filter((n) => n.needs === name);
    const cap = r.capacity || 1;
    if (busy < cap && waiting.length) out.push({ node: waiting[0].id, text: `<b>${esc(name)}</b> is free and ${waiting.length} task${waiting.length > 1 ? "s are" : " is"} ready, starting with <b>${esc(waiting[0].title)}</b>.` });
    if (busy > cap) out.push({ bad: true, text: `<b>${esc(name)}</b> has ${busy} jobs claimed but room for ${cap}.` });
    if (r.busy_series && !busy) {
      const v = matching(r.busy_series)[0]?.last_v;
      if (v != null && v > 50) out.push({ text: `<b>${esc(name)}</b> is busy (${fmtValue(r.busy_series, v)}) with nothing claimed on it.` });
    }
  }
  for (const n of nodes().filter((n) => OPEN.has(status(n)))) for (const d of n.depends || [])
    if (status(ids[d] || {}) === "failed" && !nodes().some((m) => m.mitigates === d && status(m) !== "dropped"))
      out.push({ bad: true, node: n.id, text: `<b>${esc(n.title)}</b> waits on <b>${esc(ids[d].title)}</b>, which failed and has no workaround.` });
  const watched = nodes().filter((n) => status(n) === "running").map((n) => [n, metricSeries(n)]).filter(([, s]) => s);
  const pts = await points(watched.map(([, s]) => s.id), 0, 200);
  for (const [n, s] of watched) {
    const p = (pts[s.id] || []).map((x) => x[1]);
    if (p.length < 20) continue;
    const q = (p.length / 4) | 0, mean = (a) => a.reduce((x, y) => x + y, 0) / a.length;
    const recent = mean(p.slice(-q)), before = mean(p.slice(-2 * q, -q));
    const worse = n.metric.direction === "up" ? recent < before : recent > before;
    if (Math.abs(recent - before) < 0.002 * Math.abs(before || 1)) out.push({ node: n.id, text: `<b>${esc(n.title)}</b>: ${esc(humanName(s.name))} has gone flat at ${fmtValue(s.name, recent)}.` });
    else if (worse) out.push({ node: n.id, text: `<b>${esc(n.title)}</b>: ${esc(humanName(s.name))} is moving the wrong way (${fmtValue(s.name, before)} to ${fmtValue(s.name, recent)}).` });
  }
  const pinned = pinsList().flatMap((pin) => matching(pin.series).map((s) => [pin, s])).filter(([, s]) => Date.now() - s.last_t > 15 * 60000);
  const gaps = await points(pinned.map(([, s]) => s.id), Date.now() - 7 * 864e5, 50);
  const regular = (id) => { const t = (gaps[id] || []).map((p) => p[0]); if (t.length < 4) return false; const d = t.slice(1).map((x, i) => x - t[i]).sort((a, b) => a - b); return d[d.length >> 1] < 10 * 60000; };
  for (const [pin, s] of pinned)
    if (regular(s.id)) out.push({ text: `${esc(pin.label || humanName(s.name))}${seriesLabel(s) ? " (" + esc(seriesLabel(s)) + ")" : ""} has not reported for ${span(Date.now() - s.last_t)}.` });
  return out;
}
function pinsList() {
  const raw = [...(state.config.pins || []), ...(P().meta.pins || [])].map((p) => (typeof p === "string" ? { series: p } : p));
  const seen = new Map();
  for (const p of raw) if (!seen.has(p.series) || (p.label && !seen.get(p.series).label)) seen.set(p.series, p);
  return [...seen.values()];
}

// ======================================================================
// shell
// ======================================================================
function renderShell() {
  const names = Object.keys(state.projects);
  const title = (n) => state.projects[n].meta.title || n;
  $("#projectSlot").innerHTML = names.length > 1
    ? `<select id="projectPick">${names.map((n) => `<option value="${esc(n)}" ${n === project ? "selected" : ""}>${esc(title(n))}</option>`).join("")}</select>`
    : `<span class="name">${esc(title(project))}</span>`;
  $("#sub").textContent = `plan updated ${ago(parseTime(state.built))}`;
  $("#tabs").innerHTML = TABS.map(([t, label]) => `<button class="${t === tab ? "on" : ""}" data-tab="${t}">${ICON[t]}<span>${label}</span></button>`).join("");
  $("#settingsBtn").innerHTML = ICON.gear;
  document.body.className = tab;
  document.documentElement.style.setProperty("--top-h", $("#top").offsetHeight + "px");
}
function render() {
  renderShell();
  ({ now: renderNow, plan: renderPlan, numbers: renderNumbers, history: renderHistory })[tab]();
}

function sparkPath(pts, w = 100, h = 26) {
  if (!pts || pts.length < 2) return "";
  const xs = pts.map((p) => p[0]), ys = pts.map((p) => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const X = (x) => ((x - x0) / (x1 - x0 || 1)) * w, Y = (y) => h - 2 - ((y - y0) / (y1 - y0 || 1)) * (h - 4);
  const line = pts.map((p, i) => `${i ? "L" : "M"}${X(p[0]).toFixed(2)},${Y(p[1]).toFixed(2)}`).join("");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><path class="a" d="${line}L${w},${h}L0,${h}Z"/><path class="l" d="${line}"/></svg>`;
}

// ======================================================================
// now
// ======================================================================
async function renderNow() {
  const ready = readyNodes(), running = nodes().filter((n) => status(n) === "running");
  const queued = nodes().filter((n) => status(n) === "queued").sort((a, b) => parseTime(a.created) - parseTime(b.created));
  const stats = [];
  for (const pin of pinsList()) {
    const ms = matching(pin.series);
    if (ms.length > 1 && /_(present|up|alive|ok)$/.test(ms[0].name) && ms.every((x) => x.last_v === 0 || x.last_v === 1)) { stats.push({ pin, checks: ms }); continue; }
    for (const s of ms) stats.push({ pin, s, of: pin.of ? matching(pin.of).find((o) => JSON.stringify(o.labels) === JSON.stringify(s.labels)) || matching(pin.of)[0] : null });
  }
  const resources = Object.entries(P().meta.resources || {});
  const laneOf = (n) => n.needs || "anything";
  const laneNames = [...new Set([...resources.map(([r]) => r), ...ready.map(laneOf), ...queued.map(laneOf)])]
    .filter((r) => ready.some((n) => laneOf(n) === r) || queued.some((n) => laneOf(n) === r) || running.some((n) => n.needs === r));

  $("#main").innerHTML = `
    <div class="section" id="attn" style="display:none"><div class="section-head"><h2>Needs attention</h2></div><div class="attention"></div></div>
    ${stats.length ? `<div class="section"><div class="section-head"><h2>Resources</h2></div><div class="stats">${stats.map(({ pin, s, of, checks }) => {
      if (checks) return `<div class="card stat"><div class="label">${esc(pin.label || humanName(checks[0].name))}</div><div class="checks">${checks.map((c) => `<span><i class="dot ${c.last_v ? "ok" : "no"}"></i>${esc(seriesLabel(c) || humanName(c.name))}<span class="faint tiny" style="margin-left:auto">${c.last_v ? "" : "missing"}</span></span>`).join("")}</div><div class="foot"><span>${ago(Math.max(...checks.map((c) => c.last_t)))}</span></div></div>`;
      if (s.last_v === 0 || s.last_v === 1) { if (/_(up|present|alive|ok)$/.test(s.name)) return `<div class="card stat"><div class="label">${esc(pin.label || humanName(s.name))}<span class="faint">${esc(seriesLabel(s))}</span></div><div class="value" style="font-size:20px"><i class="dot ${s.last_v ? "ok" : "no"}" style="width:10px;height:10px;margin-right:8px"></i>${s.last_v ? "yes" : "no"}</div><div class="foot"><span>${ago(s.last_t)}</span></div></div>`; }
      const label = esc(pin.label || humanName(s.name)), sub = seriesLabel(s);
      const frac = of ? s.last_v / of.last_v : pin.max ? s.last_v / pin.max : unitOf(s.name) === "%" ? s.last_v / 100 : null;
      const value = of ? `${fmtValue(s.name, s.last_v, false)}<small>/ ${fmtValue(of.name, of.last_v)}</small>` : (() => { const u = unitOf(s.name); return u === "$" ? `<small style="margin:0 2px 0 0">$</small>${fmtValue(s.name, s.last_v, false)}` : `${fmtValue(s.name, s.last_v, false)}${u && u !== "time" ? `<small>${u}</small>` : ""}`; })();
      return `<div class="card stat"><div class="label">${label}${sub ? `<span class="faint">${esc(sub)}</span>` : ""}</div>
        <div class="value num">${value}</div>
        ${frac != null ? `<div class="bar"><i style="width:${Math.max(2, Math.min(100, frac * 100)).toFixed(1)}%"></i></div>` : `<div id="sp-${s.id}"></div>`}
        <div class="foot"><span>${ago(s.last_t)}</span></div></div>`;
    }).join("")}</div></div>` : ""}
    <div class="section"><div class="section-head"><h2>Running</h2><span class="count">${running.length || ""}</span></div>
      ${running.length ? `<div class="runs">${running.map(runCard).join("")}</div>` : `<div class="empty">Nothing is running.</div>`}</div>
    <div class="section"><div class="section-head"><h2>Up next</h2><span class="count">${queued.length} queued · ${ready.length} ready</span></div>
      ${laneNames.length ? `<div class="lanes">${laneNames.map((r) => lane(r, resources, running, queued, ready, laneOf)).join("")}</div>` : `<div class="empty">Nothing is waiting.</div>`}</div>
    <div class="section"><div class="section-head"><h2>Messages</h2></div>

      return `<div class="tree-row" data-node="${esc(n.id)}" style="padding-left:${depth * 18}px">
        <span class="tw" ${has ? `data-toggle="${esc(n.id)}"` : ""}>${has ? (closed ? "▸" : "▾") : ""}</span><span class="dot st-${status(n)}"></span>
        <div class="body"><b>${esc(n.title)}</b> ${ready.has(n.id) ? `<span class="pill status st-done">ready</span>` : ""}
          <div class="s">${esc(n.summary)}</div>${deps.length ? `<div class="tiny faint">after ${esc(deps.join(", "))}</div>` : ""}</div></div>` + (closed ? "" : walk(n.id, depth + 1));
    }).join("");
  }
  $("#list").innerHTML = walk("", 0) || `<div class="empty">No tasks.</div>`;
}

// ======================================================================
// numbers
// ======================================================================
let chart, plotted = JSON.parse(store.get("plotted") || "[]");
async function renderNumbers() {
  const q = (store.get("nq") || "").toLowerCase();
  const showStale = store.get("nstale") === "1";
  const keep = new Set([...pinsList().flatMap((pin) => matching(pin.series)), ...nodes().map(metricSeries).filter(Boolean)].map((s) => s.id));
  const staleCount = series.filter((s) => stale(s) && !keep.has(s.id)).length;
  const list = series.filter((s) => (showStale || !stale(s) || keep.has(s.id)) && (s.name + " " + Object.values(s.labels).join(" ")).toLowerCase().includes(q));
  const groups = {};
  for (const s of list) (groups[s.name] ||= []).push(s);
  plotted = plotted.filter((id) => seriesById.has(id));
  $("#main").innerHTML = `<div class="section" style="margin-top:18px"><input class="field" id="nq" placeholder="Filter ${series.length - (showStale ? 0 : staleCount)} series" value="${esc(store.get("nq") || "")}" style="width:100%">
    ${staleCount ? `<label class="muted tiny" style="display:inline-flex;gap:6px;align-items:center;margin-top:8px"><input type="checkbox" id="nstale" ${showStale ? "checked" : ""}> show ${staleCount} stale series (nothing reported for over ${STALE_MS / 3600000} h)</label>` : ""}</div>
    <div class="card chart-card" id="chartCard" ${plotted.length ? "" : 'style="display:none"'}><div class="chart-head"><span class="title" id="chartTitle"></span>
      <select id="mx"><option value="">against time</option>${[...new Set(series.map((s) => s.name))].map((n) => `<option value="${esc(n)}" ${store.get("mx") === n ? "selected" : ""}>against ${esc(humanName(n))}</option>`).join("")}</select>
      <select id="mrange">${[["6 h", 6], ["24 h", 24], ["7 d", 168], ["30 d", 720], ["all", 0]].map(([l, h]) => `<option value="${h}" ${(store.get("mrange") ?? "24") === String(h) ? "selected" : ""}>${l}</option>`).join("")}</select></div><div id="chart"></div></div>
    ${Object.entries(groups).map(([name, ss]) => `<div class="series-group"><div class="section-head"><h2>${esc(humanName(name))}</h2><span class="count">${esc(name)}</span></div>
      <div class="card">${ss.map((s) => `<div class="series-row ${plotted.includes(s.id) ? "on" : ""}" data-plot="${s.id}">
        <div class="lbl">${varyingLabels(s).map(([k, v]) => `<span class="pill">${esc(v)}</span>`).join("") || `<span class="muted">${esc(humanName(name))}</span>`}</div>
        <div id="ns-${s.id}"></div>
        <div class="val num">${fmtValue(s.name, s.last_v)}<small>${ago(s.last_t)}</small></div></div>`).join("")}</div></div>`).join("") || `<div class="empty" style="margin-top:20px">No numbers yet.</div>`}`;
  if (plotted.length) plot();
  const ids = list.slice(0, 80).map((s) => s.id);
  const pts = await points(ids, Date.now() - 24 * 3600000, 60);
  for (const id of ids) { const el = $(`#ns-${id}`); if (el) el.innerHTML = sparkPath(pts[id], 100, 24); }
}
async function plot() {
  store.set("plotted", JSON.stringify(plotted));
  const card = $("#chartCard"); if (!card) return;
  card.style.display = plotted.length ? "" : "none";
  document.querySelectorAll(".series-row").forEach((r) => r.classList.toggle("on", plotted.includes(Number(r.dataset.plot))));
  if (!plotted.length) return;
  const chosen = plotted.map((id) => seriesById.get(id)).filter(Boolean);
  $("#chartTitle").textContent = [...new Set(chosen.map((s) => humanName(s.name)))].join(", ");
  const range = Number(store.get("mrange") ?? 24), since = range ? Date.now() - range * 3600000 : 0, xName = store.get("mx") || "";
  const xSeries = xName ? chosen.map((s) => series.find((x) => x.name === xName && JSON.stringify(x.labels) === JSON.stringify(s.labels))) : [];
  const pts = await points([...plotted, ...xSeries.filter(Boolean).map((s) => s.id)], since, 1500);
  const lines = chosen.map((s, i) => {
    const raw = pts[s.id] || [];
    if (!xName) return raw.map(([t, v]) => [t / 1000, v]);
    const xs = new Map((pts[xSeries[i]?.id] || []).map(([t, v]) => [t, v]));
    return raw.filter(([t]) => xs.has(t)).map(([t, v]) => [xs.get(t), v]);
  });
  const xsAll = [...new Set(lines.flatMap((l) => l.map((p) => p[0])))].sort((a, b) => a - b);
  const data = [xsAll, ...lines.map((l) => { const m = new Map(l); return xsAll.map((x) => m.get(x) ?? null); })];
  const el = $("#chart"); el.innerHTML = "";
  const css = getComputedStyle(document.documentElement), c = (v) => css.getPropertyValue(v).trim();
  const palette = [c("--link"), c("--accent"), c("--done"), c("--queued"), "#8b5cf6", "#0ea5a4", "#db2777"];
  const axis = { stroke: c("--text-3"), grid: { stroke: c("--line"), width: 1 }, ticks: { stroke: c("--line"), width: 1 }, font: "12px Inter" };
  chart?.destroy();
  chart = new uPlot({ width: el.clientWidth, height: innerWidth < 760 ? 220 : 300, scales: { x: { time: !xName } }, axes: [axis, { ...axis, size: 56, values: (u, v) => v.map((x) => fmtValue(chosen[0].name, x)) }],
    cursor: { points: { size: 6 } }, legend: { live: true },
    series: [{ label: xName ? humanName(xName) : "time" }, ...chosen.map((s, i) => ({ label: seriesLabel(s) || humanName(s.name), stroke: palette[i % palette.length], width: 2, spanGaps: true, points: { show: false } }))] }, data, el);
}

// ======================================================================
// history

function renderHistory() {
  const byDay = {};
  for (const l of P().log) {
    const t = parseTime(l.at), d = new Date(t);
    (byDay[d.toDateString()] ||= []).push({ t, ...l });
  }
  const today = new Date().toDateString(), yesterday = new Date(Date.now() - 864e5).toDateString();
  $("#main").innerHTML = Object.entries(byDay).map(([day, items]) => `<div class="day"><h3>${day === today ? "Today" : day === yesterday ? "Yesterday" : new Date(items[0].t).toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" })}</h3>
    <div class="card pad" style="padding-top:6px;padding-bottom:6px">${items.map((l) => {
      const m = String(l.text).match(/^[^:]+:\s*(.*?)(?:\s+\(([^)]*)\))?$/) || [];
      const text = m[1] || l.text, who = m[2] || "";
      const id = text.match(/^(?:add|set|claim|finish|fail|drop|edit)\s+([a-z0-9-]+)/)?.[1];
      const title = id && byId()[id] ? byId()[id].title : null;
      return `<div class="event" ${id && byId()[id] ? `data-node="${esc(id)}" style="cursor:pointer"` : ""}><span class="when num">${new Date(l.t).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}</span>
        <span>${esc(text.split(" ")[0])} ${title ? `<b>${esc(title)}</b>` : esc(text.split(" ").slice(1).join(" "))} <span class="who">· ${esc(who)}</span></span></div>`;
    }).join("")}</div></div>`).join("") || `<div class="empty">No history.</div>`;
}

// ======================================================================
// sheet: node detail, edit, settings
// ======================================================================
function openSheet(html) {
  $("#sheet").innerHTML = `<div class="handle"></div><button class="icon-btn x" id="closeSheet" aria-label="close">${ICON.x}</button>` + html;
  $("#sheet").classList.add("open"); $("#scrim").classList.add("open");
  $("#sheet").scrollTop = 0;
}
function closeSheet() {
  $("#sheet").classList.remove("open"); $("#scrim").classList.remove("open");
  selected = null; highlight(null);
  history.replaceState(null, "", "#" + tab);
}
const show = (v) => (v && typeof v === "object" ? (Array.isArray(v) ? v.map(show).join("<br>") : Object.entries(v).map(([k, x]) => `<b>${esc(k)}</b>: ${show(x)}`).join("<br>")) : esc(v));
const chip = (id) => (byId()[id] ? `<span class="pill link" data-node="${esc(id)}"><i class="dot st-${status(byId()[id])}"></i>${esc(byId()[id].title)}</span>` : `<span class="pill">${esc(id)}</span>`);

async function openNode(id, fresh) {
  const n = fresh || byId()[id];
  if (!n) return;
  selected = fresh ? null : id;
  if (!fresh) history.replaceState(null, "", `#${tab}/${id}`);
  if (!fresh) highlight(id);
  const kids = nodes().filter((c) => c.parent === n.id), needed = nodes().filter((c) => (c.depends || []).includes(n.id));
  const c = n.claim || {}, s = metricSeries(n);
  const body = { ...n }; delete body.id;
  const rows = [
    ["Status", `<span class="pill status st-${status(n)}"><i class="dot st-${status(n)}"></i>${status(n)}</span>${readyNodes().some((r) => r.id === n.id) ? ` <span class="pill status st-done">ready</span>` : ""}`],
    n.parent && ["Part of", chip(n.parent)],
    (n.depends || []).length && ["After", `<div class="chips">${n.depends.map(chip).join("")}</div>`],
    needed.length && ["Unblocks", `<div class="chips">${needed.map((x) => chip(x.id)).join("")}</div>`],
    kids.length && ["Contains", `<div class="chips">${kids.map((x) => chip(x.id)).join("")}</div>`],
    n.mitigates && ["Works around", chip(n.mitigates)],
    nodes().some((m) => m.mitigates === n.id) && ["Workarounds", `<div class="chips">${nodes().filter((m) => m.mitigates === n.id).map((m) => chip(m.id)).join("")}</div>`],
    n.needs && ["Needs", esc(n.needs)],
    n.est_h && ["Estimate", `${esc(n.est_h)} h`],
    c.session && ["Claimed by", esc(c.session)],
    c.pid && ["Process", `PID ${esc(c.pid)} on ${esc(c.host || "?")}`],
    c.started && ["Started", `${esc(clock(parseTime(c.started)))} (${ago(parseTime(c.started))})`],
    c.ends && ["Ends", Number.isFinite(parseTime(c.ends)) ? `${clock(parseTime(c.ends))} (${until(parseTime(c.ends))})` : esc(c.ends)],
    c.cmd && ["Command", `<code class="small">${esc(c.cmd)}</code>`],
    n.kaggle && ["Kaggle", esc(n.kaggle)],
    n.result && ["Result", show(n.result)],
    (n.links || []).length && ["Links", n.links.map((l) => (/^https?:/.test(l) ? `<a href="${esc(l)}" target="_blank" rel="noopener">${esc(l)}</a>` : `<code class="small">${esc(l)}</code>`)).join("<br>")],
    n.notes && ["Notes", show(n.notes)],
    ["Added", `${esc(n.by || "?")}${n.created ? ", " + esc(ago(parseTime(n.created))) : ""}`],
  ].filter(Boolean);
  openSheet(`
    <div class="tiny faint">${esc(n.kind || "task")} · ${esc(n.id || "new")}</div>
    ${fresh ? `<h1>New task</h1>` : `<h1>${esc(n.title)}</h1><p class="summary">${esc(n.summary)}</p>${n.why ? `<div class="why"><b>Why</b>${esc(n.why)}</div>` : ""}`}
    ${s ? `<div class="metric-box"><div class="tiny faint">${esc(humanName(s.name))} ${n.metric.direction === "up" ? "↑ higher is better" : "↓ lower is better"}${n.metric.target != null ? ` · target ${esc(fmtValue(s.name, n.metric.target))}` : ""}</div>
      <div class="big num">${fmtValue(s.name, s.last_v)}</div><div id="nodeSpark"></div></div>` : n.metric ? `<div class="metric-box"><div class="tiny faint">metric</div><code class="small">${esc(n.metric.series)}</code> <span class="faint small">no data yet</span></div>` : ""}
    ${fresh ? "" : `<div class="kv">${rows.map(([k, v]) => `<div>${k}</div><div>${v}</div>`).join("")}</div>`}
    <details ${fresh ? "open" : ""}><summary>${fresh ? "Fields" : "Edit"}</summary>
      ${fresh ? `<input class="field" id="eId" placeholder="id, e.g. scorecard-3d" style="width:100%;margin-top:10px">` : ""}
      <div class="status-pick">${STATUSES.map((st) => `<button class="st-${st} ${st === status(n) ? "on" : ""}" data-status="${st}"><i class="dot st-${st}"></i>${st}</button>`).join("")}</div>
      <select class="field" id="eParent" style="width:100%;margin-top:10px"><option value="">No parent (top level)</option>${nodes().filter((x) => x.id !== n.id).map((x) => `<option value="${esc(x.id)}" ${x.id === n.parent ? "selected" : ""}>${esc(x.title)}</option>`).join("")}</select>
      <textarea id="eYaml" spellcheck="false">${esc(jsyaml.dump(body, { lineWidth: 1000 }))}</textarea>
      <div class="save-row"><button class="btn primary" id="saveNode">Commit</button><span class="small muted" id="saveMsg"></span></div>
    </details>`);
  $("#sheet").dataset.id = n.id || "";
  if (s) points([s.id], 0, 300).then((p) => { const el = $("#nodeSpark"); if (el) el.innerHTML = sparkPath(p[s.id], 100, 54); });
}
function syncEdit(field, value) {
  let doc;
  try { doc = jsyaml.load($("#eYaml").value) || {}; } catch { return; }
  if (value) doc[field] = value; else delete doc[field];
  $("#eYaml").value = jsyaml.dump(doc, { lineWidth: 1000 });
}
const sentences = (t) => (String(t).trim().match(/[.!?](\s+|$)/g) || [1]).length;
async function gh(path, opts = {}) {
  const token = store.get("ghToken");
  if (!token) throw new Error("add a GitHub token in settings first");
  const res = await fetch(`https://api.github.com/repos/${state.config.repo}/contents/${path}`, { ...opts, headers: { Authorization: `Bearer ${token}`, Accept: "application/vnd.github+json" } });
  return res;
}
const b64 = (s) => btoa(String.fromCharCode(...new TextEncoder().encode(s)));
async function saveNode() {
  const msg = $("#saveMsg"), id = $("#eId") ? $("#eId").value.trim() : $("#sheet").dataset.id;
  let doc;
  try { doc = jsyaml.load($("#eYaml").value) || {}; } catch (e) { msg.textContent = "YAML: " + e.message; return; }
  const errors = [];
  if (!/^[a-z0-9][a-z0-9-]*$/.test(id)) errors.push("id: lowercase letters, digits, dashes");
  for (const k of ["title", "summary", "why"]) if (!String(doc[k] || "").trim()) errors.push(`${k} is required`);
  if (doc.summary && sentences(doc.summary) > 1) errors.push("summary: one sentence");
  if (doc.why && sentences(doc.why) > 2) errors.push("why: at most two sentences");
  if ($("#eId") && byId()[id]) errors.push("that id exists");
  for (const d of doc.depends || []) if (!byId()[d]) errors.push(`unknown dependency ${d}`);
  if (errors.length) { msg.textContent = errors.join(" · "); return; }
  msg.textContent = "Committing…";
  try {
    const path = `projects/${project}/nodes/${id}.yaml`;
    const cur = await gh(path), sha = cur.ok ? (await cur.json()).sha : undefined;
    doc.updated = new Date().toISOString().slice(0, 16).replace("T", " ");
    const res = await gh(path, { method: "PUT", body: JSON.stringify({ message: `${project}: ${sha ? "edit" : "add"} ${id} (user, web)`, content: b64(jsyaml.dump(doc, { lineWidth: 1000 })), sha }) });
    if (!res.ok) throw new Error((await res.text()).slice(0, 160));
    const i = nodes().findIndex((x) => x.id === id);
    if (i >= 0) nodes()[i] = { id, ...doc }; else nodes().push({ id, ...doc });
    _byId = null;
    msg.textContent = "Committed. The site rebuilds in about a minute.";
    render(); openNode(id);
  } catch (e) { msg.textContent = e.message; }
}
async function sendMessage() {
  const text = $("#msgText").value.trim(); if (!text) return;
  const d = new Date(), pad = (x) => String(x).padStart(2, "0");
  const id = `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}-web`;
  const off = -d.getTimezoneOffset(), tz = `${off >= 0 ? "+" : "-"}${pad(Math.floor(Math.abs(off) / 60))}${pad(Math.abs(off) % 60)}`;
  const at = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())} ${tz}`;
  try {
    const res = await gh(`projects/${project}/messages/${id}.yaml`, { method: "PUT", body: JSON.stringify({ message: `${project}: message from the user (web)`, content: b64(jsyaml.dump({ at, from: "user", text })) }) });
    if (!res.ok) throw new Error("GitHub said " + res.status);
    P().messages.push({ id, at, from: "user", text });
    render();
  } catch (e) { $("#msgText").value = text; $("#msgText").placeholder = e.message; }
}
function openSettings() {
  openSheet(`<h1>Settings</h1>
    <p class="muted small">Editing from this page commits to <b>${esc(state.config.repo)}</b> with a GitHub fine-grained token (repository access: that repo only; permission: Contents read and write). It stays in this browser.</p>
    <input class="field" id="tokenField" type="password" placeholder="github_pat_…" value="${esc(store.get("ghToken") || "")}" style="width:100%">
    <div class="save-row"><button class="btn primary" id="saveToken">Save</button><span class="small muted" id="tokenMsg"></span></div>
    <p class="faint tiny" style="margin-top:28px">Plan built ${esc(state.built)} · numbers from ${esc(worker())}</p>`);
}

// ======================================================================
// events
// ======================================================================
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-tab],[data-node],[data-toggle],[data-plot],[data-mode],[data-status],#closeSheet,#scrim,#saveNode,#sendMsg,#settingsBtn,#saveToken,#zin,#zout,#zfit,#toggleDone");
  if (!t) return;
  if (t.dataset.tab) { tab = t.dataset.tab; store.set("tab", tab); history.replaceState(null, "", "#" + tab); closeSheet(); render(); window.scrollTo(0, 0); }
  else if (t.dataset.toggle) { e.stopPropagation(); const c = new Set(JSON.parse(store.get("collapsed") || "[]")); c.has(t.dataset.toggle) ? c.delete(t.dataset.toggle) : c.add(t.dataset.toggle); store.set("collapsed", JSON.stringify([...c])); renderPlan(); }
  else if (t.dataset.node && !t.closest("#canvas")) openNode(t.dataset.node);
  else if (t.dataset.plot) { const id = Number(t.dataset.plot); const s = seriesById.get(id); const sameName = plotted.every((p) => seriesById.get(p)?.name === s.name); plotted = plotted.includes(id) ? plotted.filter((x) => x !== id) : sameName ? [...plotted, id] : [id]; plot(); }
  else if (t.dataset.mode) { planMode = t.dataset.mode; store.set("planMode", planMode); renderPlan(); }
  else if (t.dataset.status) { document.querySelectorAll(".status-pick button").forEach((b) => b.classList.toggle("on", b === t)); syncEdit("status", t.dataset.status); }
  else if (t.id === "closeSheet" || t.id === "scrim") closeSheet();
  else if (t.id === "saveNode") saveNode();
  else if (t.id === "sendMsg") sendMessage();
  else if (t.id === "settingsBtn") openSettings();
  else if (t.id === "saveToken") { store.set("ghToken", $("#tokenField").value.trim()); $("#tokenMsg").textContent = "Saved."; }
  else if (t.id === "zin" || t.id === "zout") { const g = $("#graph"); zoomAt(t.id === "zin" ? 1.25 : 0.8, g.clientWidth / 2, g.clientHeight / 2); }
  else if (t.id === "zfit") fit();
  else if (t.id === "toggleDone") { store.set("showDone", store.get("showDone") === "1" ? "0" : "1"); graphKey = ""; renderPlan(); }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "projectPick") { project = e.target.value; store.set("project", project); _byId = null; graphKey = ""; render(); }
  if (e.target.id === "eParent") syncEdit("parent", e.target.value);
  if (e.target.id === "mx") { store.set("mx", e.target.value); plot(); }
  if (e.target.id === "mrange") { store.set("mrange", e.target.value); plot(); }
  if (e.target.id === "nstale") { store.set("nstale", e.target.checked ? "1" : "0"); renderNumbers(); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "planSearch") { store.set("planSearch", e.target.value); planMode === "graph" ? applySearch() : renderPlanList(store.get("showDone") === "1"); }
  if (e.target.id === "nq") { store.set("nq", e.target.value); clearTimeout(window._nq); window._nq = setTimeout(async () => { await renderNumbers(); const f = $("#nq"); f.focus(); f.setSelectionRange(f.value.length, f.value.length); }, 250); }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeSheet();
  if (e.key === "Enter" && e.target.id === "msgText") sendMessage();
});
let resizeTimer;
addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (tab === "plan") { graphKey = ""; renderPlan(); } else document.documentElement.style.setProperty("--top-h", $("#top").offsetHeight + "px"); }, 250); });
setInterval(async () => { if (document.hidden || $("#sheet").classList.contains("open")) return; await refreshSeries(); if (tab === "now" || tab === "numbers") render(); }, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
load().catch((e) => { $("#main").innerHTML = `<div class="empty" style="margin-top:40px">Could not load: ${esc(e.message)}</div>`; });
</script>
